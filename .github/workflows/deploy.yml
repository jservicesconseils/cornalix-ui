# CI/CD : push sur develop -> environnement dev (build avec la
# configuration Angular "dev-deploy", API_BASE_URLS vers dev-*.api.cornalix.ca),
# push sur master -> environnement prod (configuration "production",
# cornalix.ca). Deux buckets S3 + distributions CloudFront distincts
# (infra/dev/frontend, infra/prod/frontend) -- jamais partages.
#
# Authentification AWS par federation OIDC (role-to-assume) -- aucune
# cle d'acces long-terme stockee en secret GitHub. Deux roles distincts
# (cornalix-prod-github-actions-ui / cornalix-dev-github-actions-ui,
# infra/prod/platform/github-oidc.tf + dev-environment.tf, cornalix-ms-identity).
name: Deploy

on:
  push:
    branches: [develop, master]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npx ng build --configuration ${{ github.ref_name == 'master' && 'production' || 'dev-deploy' }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist/cornalix-ui/browser/ "s3://${{ vars.S3_BUCKET }}/" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
