<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 100 120" width="24" height="29" role="img" aria-label="Symbole Cornalix">
        <defs>
          <clipPath id="sidebarShieldClip">
            <path d="M50 4 L92 20 V54 C92 86 72 106 50 116 C28 106 8 86 8 54 V20 Z" />
          </clipPath>
        </defs>
        <g clip-path="url(#sidebarShieldClip)">
          <rect x="0" y="0" width="50" height="120" fill="#0A5C52" />
          <rect x="50" y="0" width="50" height="120" fill="#4FD6B8" />
        </g>
        <path
          d="M50 4 L92 20 V54 C92 86 72 106 50 116 C28 106 8 86 8 54 V20 Z"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="4"
        />
        <path
          d="M32 60 L45 74 L70 42"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="9"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="brand-name">CORNALIX</span>
    </div>

    <nav class="nav">
      @for (item of navItems(); track item.route) {
        @if (item.disabled) {
          <span class="nav-link nav-link--disabled">
            <i [class]="item.icon"></i>
            {{ item.label | translate }}
          </span>
        } @else {
          <a class="nav-link" [routerLink]="item.route" routerLinkActive="active">
            <i [class]="item.icon"></i>
            {{ item.label | translate }}
          </a>
        }
      }
    </nav>

    <a class="help-link" href="#">
      <i class="pi pi-question-circle"></i>
      {{ 'nav.help' | translate }}
    </a>
  </aside>

  <div class="main-area">
    <header class="topbar">
      @if (portfolio().length > 0) {
        <p-select
          class="org-switch"
          [options]="portfolio()"
          optionLabel="name"
          optionValue="id"
          [ngModel]="currentOrganizationId()"
          (ngModelChange)="onOrganizationChange($event)"
        />
      } @else {
        <span></span>
      }

      <div class="topbar-actions">
        <button type="button" class="icon-btn" aria-label="Notifications">
          <i class="pi pi-bell"></i>
        </button>

        <button type="button" class="user-menu-trigger" (click)="userMenu.toggle($event)">
          <p-avatar [label]="user()?.initials" shape="circle" />
          <span class="user-menu-text">
            <span class="user-menu-name">{{ user()?.name }}</span>
            <span class="user-menu-role">{{ roleLabel() }}</span>
          </span>
          <i class="pi pi-chevron-down"></i>
        </button>
        <p-menu #userMenu [model]="userMenuItems" [popup]="true" />
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
