<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 44 44" width="26" height="26" role="img" aria-label="Symbole Cornalix">
        <path
          d="M22 3 L39 10 V21 C39 32 31.5 39 22 41 C12.5 39 5 32 5 21 V10 Z"
          fill="none"
          stroke="var(--accent)"
          stroke-width="2.4"
        />
        <path
          d="M15 22 L20 27 L30 15"
          fill="none"
          stroke="var(--accent-strong)"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="brand-name">CORNALIX</span>
    </div>

    <nav class="nav">
      @for (item of navItems(); track item.route) {
        @if (item.disabled) {
          <span class="nav-link nav-link--disabled">
            <i [class]="item.icon"></i>
            {{ item.label | translate }}
          </span>
        } @else {
          <a class="nav-link" [routerLink]="item.route" routerLinkActive="active">
            <i [class]="item.icon"></i>
            {{ item.label | translate }}
          </a>
        }
      }
    </nav>

    <a class="help-link" href="#">
      <i class="pi pi-question-circle"></i>
      {{ 'nav.help' | translate }}
    </a>
  </aside>

  <div class="main-area">
    <header class="topbar">
      @if (portfolio().length > 0) {
        <p-select
          class="org-switch"
          [options]="portfolio()"
          optionLabel="name"
          optionValue="id"
          [ngModel]="currentOrganizationId()"
          (ngModelChange)="onOrganizationChange($event)"
        />
      } @else {
        <span></span>
      }

      <div class="topbar-actions">
        <button type="button" class="icon-btn" aria-label="Notifications">
          <i class="pi pi-bell"></i>
        </button>

        <button type="button" class="user-menu-trigger" (click)="userMenu.toggle($event)">
          <p-avatar [label]="user()?.initials" shape="circle" />
          <span class="user-menu-text">
            <span class="user-menu-name">{{ user()?.name }}</span>
            <span class="user-menu-role">{{ roleLabel() }}</span>
          </span>
          <i class="pi pi-chevron-down"></i>
        </button>
        <p-menu #userMenu [model]="userMenuItems" [popup]="true" />
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
