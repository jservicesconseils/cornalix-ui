<div class="auth-page">
  <div class="auth-card-wrap">
    <form class="auth-card" (ngSubmit)="submit()">
      <h2>{{ 'forgotPassword.title' | translate }}</h2>
      <p class="auth-instructions">{{ 'forgotPassword.instructions' | translate }}</p>

      <div class="field">
        <label for="email">{{ 'login.email' | translate }}</label>
        <input
          pInputText
          id="email"
          type="email"
          name="email"
          autocomplete="username"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          required
        />
      </div>

      <button type="submit" class="btn-primary" [disabled]="submitting()">
        {{ submitting() ? '...' : ('forgotPassword.submit' | translate) }}
      </button>

      <p class="auth-footer-link">
        <a routerLink="/login">{{ 'forgotPassword.backToLogin' | translate }}</a>
      </p>
    </form>
  </div>
</div>
